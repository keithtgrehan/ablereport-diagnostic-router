[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-router-agent"
version = "0.1.0"
description = "Reusable LangGraph PM assistant with provider routing and JSON hardening"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "pydantic>=2",
  "python-dotenv",
  "langchain-ollama",
  "langchain-groq",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "mypy",
]
viz = [
  "pandas",
  "plotly",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_router_agent*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
